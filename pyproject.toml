[project]
name = "hello-data-in-python"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "oracledb",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "adbc-driver-manager>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_data_in_python"]
